  <body bgcolor="#E6F2FF" text="#1B263B" link="#003366">
    <nav class="navbar">

      <center>
        <font size="6">
          <b class="gradient-subtitle handwriting">A Collection of Memories</b>
        </font>
      </center>

      <center>
        <font size="7">
          <b class="gradient-text gallery-title">Gallery</b>
        </font>
      </center>

      <br />

      <center>
        <font size="4">
          Kumpulan dokumentasi berbagai momen pribadi, kegiatan bersama teman,

          </div>
        </div>
      </section>

      <section class="gallery-section">
        <h2 class="section-title">
          <span class="gradient-text section-text">Campus Life & Friends</span>

        <div class="scroll-container">
          <div class="scroll-content">
            <div class="card-nct">
              <img src="teman1.jpg" class="clickable" />
            </div>
            <div class="card-nct card-landscape">

              <img src="teman3.jpg" class="clickable" />

            <div class="card-nct card-landscape">

        <div class="scroll-container">
          <div class="scroll-content">
            <div class="card-nct card-landscape">
              <img src="photo1.jpg" class="clickable" />
            </div>
            <div class="card-nct">
              <img src="photo2.jpg" class="clickable" />
            </div>
            <div class="card-nct">
              <img src="photo3.jpg" class="clickable" />

            <div class="card-nct card-landscape">

              <img src="photo6.jpg" class="clickable" />

    <div id="lightbox" class="lightbox">
      <span class="close">&times;</span>
      <span class="prev">&#10094;</span>
      <img class="lightbox-content" id="lightbox-img" />
